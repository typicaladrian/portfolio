services:
  - type: web
    name: typicaladrian-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - typicaladrian.dev
      - www.typicaladrian.dev
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
